<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CashiBot</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #f4f4f5;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 20px;
    }
    h1 { font-size: 1.6rem; margin: 0; }
    p { color: #a1a1aa; margin: 0; max-width: 320px; }
    button {
      font-size: 1.2rem;
      padding: 18px 40px;
      border-radius: 999px;
      border: none;
      background: #6366f1;
      color: white;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.active { background: #ef4444; }
    .context-form {
      display: none;
      width: 100%;
      max-width: 480px;
      gap: 8px;
    }
    .context-form.visible { display: flex; }
    .context-form input {
      flex: 1;
      font-size: 1rem;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #f4f4f5;
    }
    .context-form button {
      font-size: 1rem;
      padding: 12px 24px;
      background: #3f3f46;
    }
    .volume-row {
      display: none;
      width: 100%;
      max-width: 480px;
      align-items: center;
      gap: 12px;
      color: #a1a1aa;
      font-size: 0.9rem;
    }
    .volume-row.visible { display: flex; }
    .volume-row input[type="range"] { flex: 1; }
    #status {
      font-size: 0.95rem;
      color: #a1a1aa;
      min-height: 1.4em;
    }
    #log {
      width: 100%;
      max-width: 480px;
      max-height: 40vh;
      overflow-y: auto;
      text-align: left;
      font-size: 0.85rem;
      line-height: 1.5;
      background: #18181b;
      border-radius: 12px;
      padding: 12px 16px;
    }
    #log div.you { color: #93c5fd; }
    #log div.bot { color: #86efac; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CashiBot</h1>
    <p>Podlacz mikrofon i glosnik (np. DJI mic przez Bluetooth), nacisnij start i zaczynaj rozmowe. W trakcie rozmowy mozesz wpisac w pole ponizej, co bot ma wkomponowac w rozmowe.</p>
    <button id="toggle">Start rozmowy</button>
    <div id="status">Gotowy</div>

    <div id="volumeRow" class="volume-row">
      <span>Glosnosc bota</span>
      <input id="volumeSlider" type="range" min="0" max="100" value="100">
      <span id="volumeValue">100%</span>
    </div>

    <form id="contextForm" class="context-form">
      <input id="contextInput" type="text" placeholder="Co bot ma wkomponowac w rozmowe..." autocomplete="off">
      <button type="submit">Wyslij</button>
    </form>

    <div id="log"></div>
  </div>

  <script type="module">
    import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/+esm";

    const toggleBtn = document.getElementById("toggle");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const contextForm = document.getElementById("contextForm");
    const contextInput = document.getElementById("contextInput");
    const volumeRow = document.getElementById("volumeRow");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeValue = document.getElementById("volumeValue");

    let conversation = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function addLog(role, text) {
      const div = document.createElement("div");
      div.className = role;
      div.textContent = (role === "you" ? "Ty: " : "Bot: ") + text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function fetchSignedUrl() {
      const res = await fetch("/api/signed-url");
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Nie udalo sie pobrac signed URL");
      return data.signedUrl;
    }

    async function startConversation() {
      toggleBtn.disabled = true;
      setStatus("Laczenie...");
      try {
        await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        const signedUrl = await fetchSignedUrl();

        conversation = await Conversation.startSession({
          signedUrl,
          onConnect: () => {
            setStatus("Polaczono - mow smialo");
            toggleBtn.textContent = "Zakoncz rozmowe";
            toggleBtn.classList.add("active");
            toggleBtn.disabled = false;
            contextForm.classList.add("visible");
            volumeRow.classList.add("visible");
            conversation.setVolume({ volume: volumeSlider.value / 100 });
          },
          onDisconnect: () => {
            setStatus("Rozlaczono");
            toggleBtn.textContent = "Start rozmowy";
            toggleBtn.classList.remove("active");
            toggleBtn.disabled = false;
            contextForm.classList.remove("visible");
            volumeRow.classList.remove("visible");
            conversation = null;
          },
          onError: (err) => {
            console.error(err);
            setStatus("Blad polaczenia");
          },
          onMessage: ({ source, message }) => {
            if (source === "user") addLog("you", message);
            if (source === "ai") addLog("bot", message);
          },
        });
      } catch (err) {
        console.error(err);
        setStatus("Blad: " + err.message);
        toggleBtn.disabled = false;
      }
    }

    async function stopConversation() {
      toggleBtn.disabled = true;
      setStatus("Konczenie...");
      if (conversation) {
        await conversation.endSession();
      }
    }

    toggleBtn.addEventListener("click", () => {
      if (conversation) {
        stopConversation();
      } else {
        startConversation();
      }
    });

    contextForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = contextInput.value.trim();
      if (!text || !conversation) return;
      conversation.sendContextualUpdate(text);
      addLog("you", "(kontekst) " + text);
      contextInput.value = "";
    });

    volumeSlider.addEventListener("input", () => {
      const pct = Number(volumeSlider.value);
      volumeValue.textContent = pct + "%";
      if (conversation) conversation.setVolume({ volume: pct / 100 });
    });
  </script>
</body>
</html>
